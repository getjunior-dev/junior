# Packaging for Junior.app. Driven by scripts/build.mjs, which stages
# .stage/junior (the usejunior package + prod node_modules) and .stage/node
# (official Node binary) first, passes the version from the root package.json,
# picks the signing identity, then zips the app with ditto (and makes the dmg).
appId: sh.usejunior.app
productName: Junior
copyright: Copyright © 2026 Junior

directories:
  output: release
  buildResources: build

# The Electron shell only: compiled main + preload + splash, and package.json.
files:
  - dist/**
  - package.json
asar: true

# The daemon and its runtime live outside the asar, as plain files the bundled
# node can execute (see ARCHITECTURE.md for the layout).
# electron-builder always drops a source's top-level node_modules, so it gets
# its own entry; naming node_modules in the filter keeps nested ones too.
extraResources:
  - from: .stage/junior
    to: junior
  - from: .stage/junior/node_modules
    to: junior/node_modules
    filter:
      - '**/*'
      - '**/node_modules/**/*'
      - '!.junior-stage'
  - from: .stage/node
    to: node
    filter:
      - '**/*'
      - '!.version'

afterPack: scripts/after-pack.cjs

# No native modules in the shell itself.
npmRebuild: false
nodeGypRebuild: false
buildDependenciesFromSource: false

mac:
  target:
    - dir
  category: public.app-category.developer-tools
  icon: build/icon.icns
  # build.mjs passes -c.mac.identity=<sha1> when a Developer ID Application
  # identity is in the keychain: electron-builder then signs every Mach-O in
  # the bundle (Resources included) with the hardened runtime and notarizes
  # when APPLE_API_KEY* or APPLE_KEYCHAIN_PROFILE is set. Without one it stays
  # null here and build.mjs signs the app ad-hoc after packing.
  identity: null
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  gatekeeperAssess: false
  minimumSystemVersion: '12.0'
  artifactName: Junior-${version}-mac-${arch}.${ext}
